<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 导航（极简版）</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;margin:0;background:#0b1020;color:#e8ecff}
    .wrap{max-width:980px;margin:0 auto;padding:22px 16px 28px}
    h1{margin:0 0 8px;font-size:20px}
    .sub{opacity:.8;font-size:12px;line-height:1.4}
    .top{display:flex;gap:10px;align-items:center;margin:14px 0 16px;flex-wrap:wrap}
    input{flex:1;min-width:240px;padding:12px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#e8ecff;outline:none}
    input:focus{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:820px){.grid{grid-template-columns:1fr}}
    .col{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:16px;padding:12px}
    .col h2{margin:0 0 10px;font-size:14px;opacity:.9}
    .list{display:grid;gap:10px}
    a.card{display:block;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
      border-radius:14px;padding:12px}
    a.card:hover{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.08)}
    .name{font-weight:700}
    .desc{opacity:.8;font-size:12px;margin-top:6px;line-height:1.35}
    .tag{display:inline-block;margin-top:10px;font-size:11px;opacity:.85;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
    footer{opacity:.65;font-size:12px;line-height:1.6;margin-top:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 导航（极简两栏）</h1>
    <div class="sub">只保留国内/国外主流入口（支持搜索过滤）。按 / 可快速聚焦搜索。</div>

    <div class="top">
      <input id="q" placeholder="搜索：deepseek / openrouter / chatgpt / kimi ..." />
    </div>

    <div class="grid">
      <div class="col">
        <h2>国内（主流）</h2>
        <div id="cn" class="list"></div>
      </div>

      <div class="col">
        <h2>国外（主流）</h2>
        <div id="global" class="list"></div>
      </div>
    </div>

    <footer>
      使用建议：把这个页面加入书签栏；或设为浏览器首页。<br/>
      如果你是 GitHub Pages 子路径站点，访问形式一般是：<code>.../仓库名/simple.html</code>
    </footer>
  </div>

<script>
  const cn = [
    {name:"DeepSeek", url:"https://chat.deepseek.com", desc:"DeepSeek 对话入口（国内热门）", tag:"对话"},
    {name:"Kimi", url:"https://kimi.moonshot.cn", desc:"长文本/文件阅读强", tag:"对话"},
    {name:"通义千问", url:"https://tongyi.aliyun.com", desc:"阿里通义千问助手", tag:"对话"},
    {name:"文心一言", url:"https://yiyan.baidu.com", desc:"百度文心一言", tag:"对话"},
    {name:"智谱清言", url:"https://chatglm.cn", desc:"智谱 ChatGLM 官方入口", tag:"对话"},
    {name:"讯飞星火", url:"https://xinghuo.xfyun.cn", desc:"科大讯飞星火", tag:"对话"},
    {name:"火山方舟", url:"https://www.volcengine.com/product/ark", desc:"字节：模型/应用平台", tag:"平台"},
    {name:"百度千帆", url:"https://qianfan.cloud.baidu.com", desc:"百度：大模型平台", tag:"平台"},
    {name:"阿里云百炼", url:"https://bailian.console.aliyun.com", desc:"阿里：模型与应用平台", tag:"平台"},
  ];

  const global = [
    {name:"ChatGPT", url:"https://chatgpt.com", desc:"OpenAI 对话/写作/代码", tag:"对话"},
    {name:"Claude", url:"https://claude.ai", desc:"Anthropic（长文本很强）", tag:"对话"},
    {name:"Gemini", url:"https://gemini.google.com", desc:"Google 助手入口", tag:"对话"},
    {name:"Microsoft Copilot", url:"https://copilot.microsoft.com", desc:"微软 Copilot 入口", tag:"对话"},
    {name:"Perplexity", url:"https://www.perplexity.ai", desc:"带引用的搜索问答", tag:"搜索"},
    {name:"OpenRouter", url:"https://openrouter.ai", desc:"多模型 API 聚合入口", tag:"API"},
    {name:"Hugging Face", url:"https://huggingface.co", desc:"模型/数据集/Spaces", tag:"开源"},
    {name:"Midjourney", url:"https://www.midjourney.com", desc:"图像生成", tag:"图像"},
  ];

  const q = document.getElementById("q");
  const cnEl = document.getElementById("cn");
  const gEl = document.getElementById("global");

  function card(x){
    return `
      <a class="card" href="${x.url}" target="_blank" rel="noreferrer">
        <div class="name">${x.name}</div>
        <div class="desc">${x.desc || ""}</div>
        <div class="tag">${x.tag || "工具"}</div>
      </a>
    `;
  }

  function render(){
    const s = (q.value || "").toLowerCase().trim();
    const f = arr => !s ? arr : arr.filter(x =>
      (x.name + " " + (x.desc||"") + " " + (x.tag||"")).toLowerCase().includes(s)
    );

    cnEl.innerHTML = f(cn).map(card).join("");
    gEl.innerHTML = f(global).map(card).join("");
  }

  q.addEventListener("input", render);

  // / 聚焦
  window.addEventListener("keydown", (e)=>{
    if(e.key==="/" && document.activeElement !== q){
      e.preventDefault(); q.focus();
    }
    if(e.key==="Escape"){
      q.value=""; q.blur(); render();
    }
  });

  render();
</script>
</body>
</html>
